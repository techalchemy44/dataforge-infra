apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hdfs-datanode
  namespace: dataforge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hdfs-datanode
  namespace: dataforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hdfs-datanode
  template:
    metadata:
      labels:
        app: hdfs-datanode
    spec:
      initContainers:
        - name: initialize-storage
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data/data
              chown -R 1001:100 /data/data
              chmod 755 /data/data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: datanode-data
              mountPath: /data/data

      containers:
        - name: datanode
          image: ghcr.io/apache/hadoop:3.5.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              exec hdfs datanode
          ports:
            - name: http
              containerPort: 9864
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /opt/hadoop/etc/hadoop/core-site.xml
              subPath: core-site.xml
            - name: config
              mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
              subPath: hdfs-site.xml
            - name: datanode-data
              mountPath: /data/data

      volumes:
        - name: config
          configMap:
            name: hdfs-config
        - name: datanode-data
          persistentVolumeClaim:
            claimName: hdfs-datanode
