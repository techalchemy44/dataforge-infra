apiVersion: v1
kind: Service
metadata:
  name: hdfs-namenode
  namespace: dataforge
spec:
  selector:
    app: hdfs-namenode
  ports:
    - name: rpc
      port: 8020
      targetPort: 8020
    - name: http
      port: 9870
      targetPort: 9870
---
apiVersion: v1
kind: Service
metadata:
  name: hdfs-datanode
  namespace: dataforge
spec:
  selector:
    app: hdfs-datanode
  ports:
    - name: http
      port: 9864
      targetPort: 9864
